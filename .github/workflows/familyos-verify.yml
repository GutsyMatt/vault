name: FamilyOS verification (no deployment)
on:
  pull_request:
    paths:
      - 'apps/familyos/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/familyos-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Typecheck, tests, Cloudflare dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck --prefix apps/familyos
      - name: Test FamilyOS
        run: npm test
      - name: Dry-run production configuration (does not deploy)
        run: npx wrangler deploy --dry-run -c wrangler.jsonc
