name: FamilyOS verified intake adapter
on:
  pull_request:
    paths:
      - 'tools/familyos-intake*.mjs'
      - '.github/workflows/familyos-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/familyos-intake.test.mjs
