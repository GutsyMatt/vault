name: FamilyOS evidence download integrity regression
on:
  pull_request:
    paths:
      - 'apps/familyos/src/storage/person-vault.ts'
      - '.github/workflows/evidence-download-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
