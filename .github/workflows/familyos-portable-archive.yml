name: FamilyOS offline archive tests
on:
  pull_request:
    paths:
      - 'tools/familyos-portable-archive*.mjs'
      - '.github/workflows/familyos-portable-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/familyos-portable-archive.test.mjs
